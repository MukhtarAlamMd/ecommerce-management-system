server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:

            # ==============================
            # PRODUCT SERVICE
            # ==============================
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**,/api/categories/**

            # ==============================
            # PRODUCT IMAGES
            # ==============================
            - id: product-image-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/uploads/products/**

            # ==============================
            # INVENTORY SERVICE
            # ==============================
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory/**

            # ==============================
            # ORDER SERVICE
            # ==============================
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**

            # ==============================
            # PAYMENT SERVICE
            # ==============================
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**

            # ==============================
            # NOTIFICATION SERVICE
            # ==============================
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            #==================================
            #AI SERVICE
            #===================================

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/messages/**
  # ==============================
  # KEYCLOAK / OAUTH2 RESOURCE SERVER
  # ==============================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/ecommerce
          jwk-set-uri: http://host.docker.internal:8088/realms/ecommerce/protocol/openid-connect/certs


# ==============================
# EUREKA
# ==============================
eureka:
  client:
    service-url:
      defaultZone: http://ecommerce-service-registry:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


# ==============================
# ACTUATOR
# ==============================
management:
  endpoints:
    web:
      exposure:
        include: "*"


# ==============================
# LOGGING
# ==============================
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: DEBUG




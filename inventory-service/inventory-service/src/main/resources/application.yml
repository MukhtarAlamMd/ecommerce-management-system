server:
  port: 8086


spring:

  # =========================================================
  # APPLICATION
  # =========================================================

  application:
    name: inventory-service


  # =========================================================
  # DATASOURCE
  # =========================================================

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  # =========================================================
  # JPA
  # =========================================================

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true


  # =========================================================
  # JACKSON
  # =========================================================

  jackson:
    serialization:
      fail-on-empty-beans: false


  # =========================================================
  # KEYCLOAK / OAUTH2 RESOURCE SERVER
  # =========================================================

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/ecommerce
          jwk-set-uri: http://host.docker.internal:8088/realms/ecommerce/protocol/openid-connect/certs


# =========================================================
# EUREKA
# =========================================================

eureka:

  client:
    service-url:
      defaultZone: http://ecommerce-service-registry:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


# =========================================================
# ACTUATOR
# =========================================================

management:

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always


# =========================================================
# SWAGGER
# =========================================================

springdoc:

  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html




services:

  # =========================================================
  # EUREKA SERVICE REGISTRY
  # =========================================================
  ecommerce-service-registry:
    build:
      context: ./service-registry/service-registry
      dockerfile: Dockerfile
    container_name: ecommerce-service-registry
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network


    # =========================================================
  # KAFKA
  # =========================================================
  kafka:
    image: apache/kafka:3.9.1
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - ecommerce-network

  # =========================================================
  # PRODUCT SERVICE
  # =========================================================
  product-service:
    build:
      context: ./product-service/product-service
      dockerfile: Dockerfile
    container_name: ecommerce-product-service
    volumes:
      - ./service-registry/uploads/products:/app/uploads/products
    ports:
      - "8082:8082"
    depends_on:
      - ecommerce-service-registry
    networks:
      - ecommerce-network


  # =========================================================
  # INVENTORY SERVICE
  # =========================================================
  inventory-service:
    build:
      context: ./inventory-service/inventory-service
      dockerfile: Dockerfile
    container_name: ecommerce-inventory-service
    ports:
      - "8086:8086"
    depends_on:
      - ecommerce-service-registry
    networks:
      - ecommerce-network


  # =========================================================
  # PAYMENT SERVICE
  # =========================================================
  payment-service:
    build:
      context: ./payment-service/payment-service
      dockerfile: Dockerfile
    container_name: ecommerce-payment-service
    ports:
      - "8085:8085"
    depends_on:
      - ecommerce-service-registry
      - kafka
    networks:
      - ecommerce-network


  # =========================================================
  # NOTIFICATION SERVICE
  # =========================================================
  notification-service:
    build:
      context: ./notification-service/notification-service
      dockerfile: Dockerfile
    container_name: ecommerce-notification-service
    ports:
      - "8087:8087"
    depends_on:
      - ecommerce-service-registry
      - kafka
    networks:
      - ecommerce-network


  # =========================================================
  # ORDER SERVICE
  # =========================================================
  order-service:
    build:
      context: ./order-service/order-service
      dockerfile: Dockerfile
    container_name: ecommerce-order-service
    ports:
      - "8084:8084"
    depends_on:
      - ecommerce-service-registry
      - kafka
      - product-service
      - inventory-service
      - payment-service
    networks:
      - ecommerce-network


  # =========================================================
  # API GATEWAY
  # =========================================================
  api-gateway:
    build:
      context: ./api-gateway/api-gateway
      dockerfile: Dockerfile
    container_name: ecommerce-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - ecommerce-service-registry
      - product-service
      - inventory-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - ecommerce-network


# =========================================================
# NETWORK
# =========================================================
networks:
  ecommerce-network:
    driver: bridge

spring:

  application:
    name: order-service

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false


  # =========================================
  # KEYCLOAK / OAUTH2 RESOURCE SERVER
  # =========================================

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/ecommerce
          jwk-set-uri: http://host.docker.internal:8088/realms/ecommerce/protocol/openid-connect/certs


server:
  port: 8084


# =========================================
# EUREKA
# =========================================

eureka:
  client:
    service-url:
      defaultZone: http://ecommerce-service-registry:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


# =========================================
# APPLICATION KAFKA SETTINGS
# =========================================

app:
  kafka:
    notification-topic: notification-events






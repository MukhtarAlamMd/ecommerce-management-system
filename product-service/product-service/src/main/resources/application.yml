server:
  port: 8082

spring:
  application:
    name: product-service

  # =========================================================
  # DATABASE
  # =========================================================
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =========================================================
  # JPA / HIBERNATE
  # =========================================================
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  # =========================================================
  # JACKSON
  # =========================================================
  jackson:
    serialization:
      fail-on-empty-beans: false

  # =========================================================
  # MULTIPART / IMAGE UPLOAD
  # =========================================================
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # =========================================================
  # KEYCLOAK / OAUTH2 RESOURCE SERVER
  # =========================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/ecommerce
          jwk-set-uri: http://host.docker.internal:8088/realms/ecommerce/protocol/openid-connect/certs


# =========================================================
# EUREKA
# =========================================================

eureka:
  client:
    service-url:
      defaultZone: http://ecommerce-service-registry:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


# =========================================================
# ACTUATOR
# =========================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always


# =========================================================
# SWAGGER
# =========================================================

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html




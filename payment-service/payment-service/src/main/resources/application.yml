server:
  port: 8085

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false

  # =========================================================
  # KAFKA
  # =========================================================
  kafka:
    bootstrap-servers: kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false

  # =========================================================
  # KEYCLOAK / OAUTH2 RESOURCE SERVER
  # =========================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/ecommerce
          jwk-set-uri: http://host.docker.internal:8088/realms/ecommerce/protocol/openid-connect/certs


# =========================================================
# KAFKA APPLICATION CONFIGURATION
# =========================================================

app:
  kafka:
    notification-topic: notification-events


# =========================================================
# EUREKA
# =========================================================

eureka:
  client:
    service-url:
      defaultZone: http://ecommerce-service-registry:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


# =========================================================
# ACTUATOR
# =========================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always


# =========================================================
# SWAGGER
# =========================================================

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html



